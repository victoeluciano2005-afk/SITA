name: Build SiTa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      
      - name: Restore permanent debug keystore
        env:
          SITA_KEYSTORE_BASE64: ${{ secrets.SITA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SITA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SITA_KEY_ALIAS }}
        run: |
          printf '%s' "$SITA_KEYSTORE_BASE64" | base64 --decode > debug.keystore
        keytool -list -v -keystore debug.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E 'SHA1:|SHA256:'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SiTa-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
